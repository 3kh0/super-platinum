[package]
name = "super-platinum"
version = "0.1.0"
edition = "2024"
description = "A stupid fast and lightweight Slack client"
license-file = "LICENSE.txt"

[[bin]]
name = "super-platinum"
path = "src/desktop/main.rs"

[package.metadata.bundle]
name = "Super Platinum"
identifier = "com.echonet.superplatinum"
icon = ["assets/icons/super-platinum.icns", "assets/icons/super-platinum.ico", "assets/icons/super-platinum.svg"]
short_description = "A stupid fast and lightweight Slack client"
long_description = "A fast native Rust Slack client rendered with Dioxus Desktop."
category = "public.app-category.social-networking"
osx_url_schemes = ["slack"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast full rebuilds and UI iteration; use dev for runtime performance profiling.
[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

# Override the inherited level-3 dependency optimization as well.
[profile.dev-fast.package."*"]
opt-level = 0
debug = false

# Full rebuilds do not benefit from writing an incremental dependency graph.
# Keep dev-fast for repeated edits and its line-number backtraces.
[profile.dev-rebuild]
inherits = "dev-fast"
incremental = false
debug = false
# Disabling incremental otherwise reduces Cargo's default to 16 codegen units.
codegen-units = 256

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"

[features]
original-download-native-fixture = ["super-platinum-core/original-download-fixture"]
emoji-retirement-observation = ["windows/Win32_System_Memory"]
protected-native-fixture = ["super-platinum-core/protected-test-support"]

[dependencies]
base64 = "0.23"
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "57d6794ad60b949e5bd8aa282f6f8c3dc97a365e", default-features = false, features = ["desktop", "document", "minimal"] }
super-platinum-core = { path = "crates/super-platinum-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "net",
    "process",
    "sync",
    "time",
] }
url = "2"
uuid = { version = "=1.29.0", features = ["v4"] }
# Same dialog backend/version already used by the pinned Dioxus desktop crate.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Use dioxus::desktop::{tao, wry} so native types match Dioxus's versions.
# Keep Wry's default X11 feature for the standalone Linux login window.
# Update this pin together with Dioxus's Wry dependency.
wry = "=0.53.5"

[dev-dependencies]
super-platinum-core = { path = "crates/super-platinum-core", features = ["protected-test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Match the version already used by the pinned desktop dependency graph.
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSApplication", "NSDockTile"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSObject", "NSProcessInfo", "NSCalendar"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound"] }
