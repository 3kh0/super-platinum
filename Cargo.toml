[package]
name = "super-platinum"
version = "0.1.0"
edition = "2024"
description = "A stupid fast and lightweight Slack client"
license-file = "LICENSE.txt"

[[bin]]
name = "super-platinum"
path = "src/desktop/main.rs"

[package.metadata.bundle]
name = "Super Platinum"
identifier = "com.echonet.superplatinum"
icon = ["assets/icons/super-platinum.icns", "assets/icons/super-platinum.ico", "assets/icons/super-platinum.svg"]
short_description = "A stupid fast and lightweight Slack client"
long_description = "A fast native Rust Slack client rendered with Dioxus Desktop."
category = "public.app-category.social-networking"
osx_url_schemes = ["slack"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"

[dependencies]
base64 = "0.23"
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "57d6794ad60b949e5bd8aa282f6f8c3dc97a365e", default-features = false, features = ["desktop", "document", "minimal"] }
super-platinum-core = { path = "crates/super-platinum-core" }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "net",
    "process",
    "sync",
    "time",
] }
url = "2"
# tao and wry must match the versions dioxus-desktop resolves to. A different
# version compiles a second copy into the graph, and its traits (for example
# WindowExtWindows::hwnd) then do not apply to the window dioxus hands us.
tao = "0.37.0"
wry = "0.53.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
