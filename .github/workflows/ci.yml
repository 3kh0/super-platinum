name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-linux

      - name: Clippy
        run: cargo clippy --locked --all-targets

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-24.04
    env:
      ICED_TEST_BACKEND: tiny-skia
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Configure CMake for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\.github\cmake\windows-arm64.cmake" >> $env:GITHUB_ENV

      - name: Install CMake on macOS
        if: runner.os == 'macOS'
        run: brew install cmake gstreamer

      - name: Install GStreamer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"
          $arch = if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") { "arm64" } else { "x86_64" }
          $root = "$env:LOCALAPPDATA\Programs\gstreamer\1.0\msvc_$arch"
          $installer = "$env:RUNNER_TEMP\gstreamer.exe"
          $installLog = "$env:RUNNER_TEMP\gstreamer-install.log"
          Invoke-WebRequest `
            -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.5/msvc/gstreamer-1.0-msvc-$arch-1.28.5.exe" `
            -OutFile $installer
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/CURRENTUSER",
              "/TYPE=devel",
              "/DIR=$root",
              "/LOG=$installLog"
            ) `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "GStreamer installer exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path "$root\lib\pkgconfig")) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "GStreamer development files were not installed under $root"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}
